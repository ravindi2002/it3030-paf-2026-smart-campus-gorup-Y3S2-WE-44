spring.application.name=SmartCampus API

# Lightweight profile for low memory systems
spring.profiles.active=dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Memory optimization
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# H2 Database
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Datasource
spring.datasource.url=jdbc:h2:file:./data/smartcampus
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server
server.port=8081

# Google OAuth2 - Spring Security built-in provider configuration
# IMPORTANT: Replace with your actual Google OAuth2 credentials from Google Cloud Console
# 1. Go to: https://console.cloud.google.com/apis/credentials
# 2. Create OAuth2 Client ID (Web application)
# 3. Add authorized redirect URI: http://localhost:8081/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=829144181992-2f74bimn9sijeksp1qcis8j603incdq4.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=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
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8081/login/oauth2/code/google

# Google OAuth2 provider endpoints (built-in defaults, but explicitly set for clarity)
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v2/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=email