name: Smart Campus CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ==================== Backend Build & Test ====================
  build-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      backend-result: ${{ steps.build.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build application
        id: build
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean package -DskipTests -q
          echo "result=success" >> $GITHUB_OUTPUT

      - name: Run unit tests
        run: |
          cd backend
          ./mvnw test -Dtest=ResourceServiceTest,BookingServiceTest,TicketServiceTest,NotificationServiceTest

      - name: Run additional tests
        run: |
          cd backend
          ./mvnw test -Dtest=UserServiceTest,CommentServiceTest

      - name: Generate test reports
        if: always()
        run: |
          cd backend
          ls -la target/surefire-reports/ 2>/dev/null || echo "No reports yet"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 30

  # ==================== Frontend Build ====================
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

- name: TypeScript type check (warning only)
        run: |
          cd frontend
          npx tsc --noEmit || echo "TypeScript check completed with warnings"

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 30

  # ==================== Security Checks ====================
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Check Maven dependency integrity
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw dependency:resolve

      - name: Check for known vulnerabilities (OWASP)
        run: |
          cd backend
          ./mvnw org.owasp:dependency-check-maven:check -q || true

      - name: Verify spotless code formatting
        run: |
          cd backend
          ./mvnw com.github.hkust-fosp:spotless-maven-plugin:check -q 2>&1 || echo "Spotless check skipped"